# Sample Forgejo engine config (canned prompts).
#
# Used by the UI tests (make test-ui), which point MAITRED_FORGEJOENG_DIR at
# a copy of this file. In production the config is deployed by s-puppet
# (§forgejo/config/loading).
org: o
reconcile_interval: 1h
# Optional: the identity authorship decisions hold off on
# (§forgejo/config/decomposer-identity). Unset, the hold-off is inert.
decomposer_identity: decomposer

# Every prompt invokes the persona's Pi canned prompt: Pi expands a
# prompt template only when the dispatched message starts with
# "/<template-name>", so a prompt without the leading slash travels to
# the agent verbatim — the canned prompt never runs and its parameter
# value (the issue or pull request URL) never arrives. Each prompt
# therefore begins with the slash invocation and passes the URL the
# dispatch kind fills (§forgejo/config/canned-prompts).
actions:
  implement:
    prompt: "/issue-implementer {{.IssueURL}}"
    persona: ui-test
    timeout: 1h
  reassess:
    prompt: "/issue-reassess {{.IssueURL}}"
    persona: ui-test
    timeout: 1h
  review:
    prompt: "/pr-reviewer {{.PRURL}}"
    persona: ui-test
    timeout: 1h
  re-review:
    prompt: "/pr-reviewer {{.PRURL}} (re-review)"
    persona: ui-test
    timeout: 1h
  fix-feedback:
    prompt: "/pr-feedback-fixer {{.PRURL}}"
    persona: ui-test
    timeout: 1h
  merge-or-wait:
    prompt: "/pr-merger {{.PRURL}}"
    persona: ui-test
    timeout: 1h
  rebase:
    prompt: "/pr-rebase {{.PRURL}}"
    persona: ui-test
    timeout: 1h
  decompose:
    # The spec holds this template to naming the fan-out cap and
    # requiring the agent to cite it when refusing
    # (§forgejo/config/canned-prompts).
    prompt: "/issue-decomposer {{.IssueURL}} (the fan-out cap is 20 tickets per forest — cite this cap when refusing)"
    persona: ui-test
    timeout: 1h
  wrap-up:
    prompt: "/issue-wrapper {{.IssueURL}}"
    persona: ui-test
    timeout: 1h
  reject-pr:
    prompt: "/pr-rejector {{.PRURL}}"
    persona: ui-test
    timeout: 1h
  teardown-forest:
    prompt: "/forest-teardown {{.IssueURL}}"
    persona: ui-test
    timeout: 1h
  sync:
    prompt: "/set-lander {{.IssueURL}}"
    persona: ui-test
    timeout: 1h
