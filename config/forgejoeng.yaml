# Sample Forgejo engine config (canned prompts).
#
# Used by the UI tests (make test-ui), which point MAITRED_FORGEJOENG_DIR at
# a copy of this file. In production the config is deployed by s-puppet
# (§forgejo/config/loading).
org: o
reconcile_interval: 1h
# Optional: the identity that composes forests — read as a gate by one
# row alone: a comment on an open ideation root authored by this login
# holds off, any other author's re-cures the forest. Matched by exact,
# case-sensitive comparison against the comment's author
# (§forgejo/config/decomposer-identity, s-git/maitred#147).
decomposer_identity: decomposer
# Optional: the identity that implements work and fixes review feedback.
# When set, fix-feedback dispatches only on PRs authored by this identity;
# unset, the ownership gate is inert (§forgejo/config/implementer-identity,
# s-git/maitred#143).
implementer_identity: implementer

# Every prompt invokes the runner-side Pi canned prompt of the identity
# the task runs as: Pi expands a prompt template only when the
# dispatched message starts with "/<template-name>", so a prompt without
# the leading slash travels to the agent verbatim — the canned prompt
# never runs and its parameter value (the issue or pull request URL)
# never arrives. Each prompt therefore begins with the slash invocation
# and passes the URL the dispatch kind fills
# (§forgejo/config/canned-prompts). The command names are the convention
# that section pins: the identity's Pi prompt directory must hold a
# template of that name, or Pi passes the message verbatim and nothing
# expands. Each entry declares exactly one `identity` — the forge login
# the task runs as, the same name a decision would compare against were
# it reviewing — and no other name: `persona` is not part of this
# config's schema, and a config carrying it is refused as the schema
# mismatch it is (§forgejo/config/identity-collapse).
actions:
  implement:
    prompt: "/issue-implementer {{.IssueURL}}"
    identity: implementer
    timeout: 1h
  reassess:
    prompt: "/issue-reassess {{.IssueURL}}"
    identity: implementer
    timeout: 1h
  fix-feedback:
    prompt: "/pr-feedback-fixer {{.PRURL}}"
    identity: implementer
    timeout: 1h
  merge-or-wait:
    prompt: "/pr-merger {{.PRURL}}"
    identity: reviewer
    timeout: 1h
  rebase:
    prompt: "/pr-rebase {{.PRURL}}"
    identity: implementer
    timeout: 1h
  decompose:
    # The spec holds this template to naming the fan-out cap and
    # requiring the agent to cite it when refusing
    # (§forgejo/config/canned-prompts). Pi splits an invocation's
    # arguments on whitespace, so the text rides quoted — unquoted it
    # arrives as a dozen positional arguments a template reading only
    # $1 never renders.
    prompt: '/issue-decomposer {{.IssueURL}} "the fan-out cap is 20 tickets per forest — cite this cap when refusing"'
    identity: decomposer
    timeout: 1h
  wrap-up:
    prompt: "/issue-wrapper {{.IssueURL}}"
    identity: implementer
    timeout: 1h
  teardown-forest:
    prompt: "/forest-teardown {{.IssueURL}}"
    identity: decomposer
    timeout: 1h
  sync:
    prompt: "/set-lander {{.IssueURL}}"
    identity: implementer
    timeout: 1h

# The review chain, in order: the three lenses every pull request
# passes through (§forgejo/config/review-lenses). Extending or
# contracting the chain is an edit here, not a code change. The
# fan-out dispatches exactly the lenses with no undismissed approval
# at the head, so at first all three run in parallel, a push re-fires
# the ones whose approvals went stale, and a fully rejecting round
# sends everything back through the chain.
reviews:
  - identity: reviewer-minimalism
    prompt: '/pr-minimalism-reviewer {{.PRURL}}'
    timeout: 30m
  - identity: reviewer-maintainability
    prompt: '/pr-maintainability-reviewer {{.PRURL}}'
    timeout: 30m
  - identity: reviewer-security
    prompt: '/pr-security-reviewer {{.PRURL}}'
    timeout: 30m
